<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nora's Birthday Party Games</title>
<style>
@font-face{font-family:"PS2P";src:url(assets/pressstart.woff2) format("woff2");font-display:block}
@font-face{font-family:"Pixelify";src:url(assets/pixelify400.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Pixelify";src:url(assets/pixelify700.woff2) format("woff2");font-weight:700;font-display:block}
:root{--ink:#2a1760;--pink:#ff5fae;--hot:#ff3d9a;--lav:#b99cff;--aqua:#6fe3ff;--yel:#ffe066;--mint:#7df0c0;--cream:#fff7e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c0f3d;overflow:hidden;font-family:"Pixelify",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
img{image-rendering:auto;-webkit-user-drag:none;pointer-events:none}
.hidden{display:none!important}

/* ---------- viewport & stage ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:
  repeating-linear-gradient(45deg,#2a1760 0 18px,#24134f 18px 36px)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#ffd6ec}
.screen{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;left:0;top:0;width:1672px;height:941px;transform:scale(1.148325);transform-origin:0 0}
.scene>img.bg{position:absolute;left:0;top:0;width:1672px;height:941px}
.abs{position:absolute}

/* pixel text */
.px{font-family:"PS2P",monospace;color:#fff;letter-spacing:2px;line-height:1.25;
 text-shadow:
 0 -6px 0 var(--ink),0 6px 0 var(--ink),-6px 0 0 var(--ink),6px 0 0 var(--ink),
 -6px -6px 0 var(--ink),6px -6px 0 var(--ink),-6px 6px 0 var(--ink),6px 6px 0 var(--ink),
 0 12px 0 var(--ink),6px 12px 0 var(--ink),-6px 12px 0 var(--ink),12px 12px 0 rgba(42,23,96,.35)}
.px.sm{text-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink),4px 4px 0 var(--ink),0 8px 0 var(--ink),4px 8px 0 var(--ink),-4px 8px 0 var(--ink)}
.rainbow span:nth-child(6n+1){color:#ff6fb5}.rainbow span:nth-child(6n+2){color:#ffd84d}.rainbow span:nth-child(6n+3){color:#7df0c0}
.rainbow span:nth-child(6n+4){color:#6fd6ff}.rainbow span:nth-child(6n+5){color:#c9a4ff}.rainbow span:nth-child(6n){color:#ff9a5c}

/* ---------- HOME ---------- */
#s-home{background:linear-gradient(180deg,#ffb6dd 0%,#ffd7ec 38%,#c8f4ff 100%)}
#s-home .checker{position:absolute;left:0;right:0;bottom:0;height:150px;
 background:conic-gradient(#ff8cc6 25%,#fff3fa 0 50%,#ff8cc6 0 75%,#fff3fa 0) 0 0/60px 60px;border-top:10px solid var(--ink)}
#s-home .scallop{position:absolute;left:0;right:0;top:0;height:70px;
 background:radial-gradient(circle at 40px 0,#fff3c4 38px,#ff6fb5 39px 46px,transparent 47px) 0 0/80px 70px}
#home-title{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:84px}
#home-name{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:120px}
#home-nine{position:absolute;left:50%;top:445px;transform:translateX(-50%);font-size:470px;line-height:1;
 color:#ffe066;animation:nineBob 3.2s ease-in-out infinite;
 text-shadow:0 -14px 0 var(--ink),0 14px 0 var(--ink),-14px 0 0 var(--ink),14px 0 0 var(--ink),-14px -14px 0 var(--ink),14px -14px 0 var(--ink),-14px 14px 0 var(--ink),14px 14px 0 var(--ink),
 0 28px 0 var(--ink),14px 28px 0 var(--ink),-14px 28px 0 var(--ink),28px 28px 0 #ff5fae,28px 42px 0 var(--ink)}
@keyframes nineBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-2deg)}50%{transform:translateX(-50%) translateY(-18px) rotate(2deg)}}
.balloon{position:absolute;width:120px;height:250px;animation:floaty 7s ease-in-out infinite}
.balloon canvas{width:120px;height:150px;image-rendering:pixelated}
.balloon .str{position:absolute;left:58px;top:146px;width:4px;height:110px;background:repeating-linear-gradient(180deg,var(--ink) 0 8px,transparent 8px 12px)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-34px) rotate(3deg)}}
.sparkle{position:absolute;width:48px;height:48px;pointer-events:none;animation:spark 1.4s ease-out forwards}
.sparkle:before,.sparkle:after{content:"";position:absolute;left:20px;top:0;width:8px;height:48px;background:#fff;box-shadow:0 0 0 4px #ffe066}
.sparkle:after{left:0;top:20px;width:48px;height:8px}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.2) rotate(20deg)}100%{transform:scale(0) rotate(45deg);opacity:0}}

/* ---------- SELECT ---------- */
#s-select{background:linear-gradient(180deg,#c9b2ff,#ffc6e6)}
#sel-title{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:76px}
#sel-grid{position:absolute;left:90px;right:90px;top:260px;display:flex;gap:40px;justify-content:center}
.tile{width:310px;height:600px;background:var(--cream);border:10px solid var(--ink);border-radius:28px;box-shadow:0 16px 0 var(--ink);
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 14px 30px;animation:tileBob 3s ease-in-out infinite}
.tile:nth-child(2){animation-delay:-.6s}.tile:nth-child(3){animation-delay:-1.2s}.tile:nth-child(4){animation-delay:-1.8s}.tile:nth-child(5){animation-delay:-2.4s}
@keyframes tileBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.tile .num{font-family:"PS2P";font-size:64px;color:#fff;background:var(--pink);border:8px solid var(--ink);width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tile img{max-width:230px;max-height:200px}
.tile .lbl{font-family:"Pixelify";font-weight:700;font-size:39px;line-height:1.05;text-align:center;color:var(--ink)}

/* ---------- shared overlays ---------- */
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:50}
#banner{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:58px;white-space:nowrap;z-index:30;pointer-events:none;transition:opacity .3s}
#banner.mid{top:430px;font-size:110px}
#banner.bottom{top:auto;bottom:60px}
#banner.claw{top:330px}
#banner.pop{animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:35;background:var(--cream);border:12px solid var(--ink);border-radius:36px;
 box-shadow:0 20px 0 var(--ink),0 0 0 9999px rgba(42,23,96,.35);padding:50px 70px;text-align:center;width:1400px}
#card .big{font-family:"PS2P";font-size:62px;line-height:1.35;color:var(--ink)}
#card img{max-height:330px;max-width:520px;display:block;margin:0 auto 40px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.04)}}
#count{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:40;font-size:400px;pointer-events:none}
#count.show span{display:inline-block;animation:countPop .85s ease-out forwards}
@keyframes countPop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{transform:scale(.95);opacity:1}100%{transform:scale(.6);opacity:0}}
#count.go span{animation:goPop .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes goPop{0%{transform:scale(.2)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.dim{position:absolute;inset:0;background:rgba(42,23,96,.55);z-index:20}

/* ---------- HUNT ---------- */
#s-hunt{background:repeating-linear-gradient(45deg,#ffc2e2 0 40px,#ffd9ee 40px 80px)}
#hunt-scene{transition:opacity .4s}
#hunt-item{position:absolute;transform-origin:50% 50%}
#hunt-item img{width:100%;height:100%;display:block}
#hunt-item.wig img{animation:wiggle 1.3s ease-in-out}
#hunt-item.wigloop img{animation:wiggle 1.3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-16deg) scale(1.08)}25%{transform:rotate(14deg) scale(1.08)}40%{transform:rotate(-12deg) scale(1.06)}55%{transform:rotate(10deg) scale(1.04)}70%{transform:rotate(-6deg)}85%{transform:rotate(3deg)}}
#hunt-chip{position:absolute;right:30px;top:30px;z-index:25;background:var(--cream);border:8px solid var(--ink);border-radius:24px;box-shadow:0 10px 0 var(--ink);padding:14px 26px;display:flex;align-items:center;gap:20px}
#hunt-chip span{font-family:"PS2P";font-size:30px}
#hunt-chip img{height:90px;max-width:150px}
#spot{position:absolute;inset:0;z-index:22;pointer-events:none}
.ring{position:absolute;border:12px solid #fff;border-radius:50%;box-shadow:0 0 0 8px var(--hot),inset 0 0 0 8px var(--hot);z-index:23;animation:ringPulse 1s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- MEMORY ---------- */
.mem-item{position:absolute;transform-origin:50% 100%;transition:opacity .2s}
.mem-item.pop{animation:memPop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes memPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.mem-label{position:absolute;transform:translateX(-50%);font-size:40px;white-space:nowrap;z-index:5}
#mem-timer{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:25;width:250px;height:250px;border-radius:50%;background:var(--yel);border:12px solid var(--ink);box-shadow:0 14px 0 var(--ink);
 display:flex;align-items:center;justify-content:center;font-family:"PS2P";font-size:110px;color:var(--ink)}
#mem-timer.low{background:#ff8fc4;animation:timerShake .4s ease-in-out infinite}
@keyframes timerShake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-5deg)}75%{transform:translateX(-50%) rotate(5deg)}}
#curtain{position:absolute;inset:0;z-index:28;transform:translateY(-102%);transition:transform .55s cubic-bezier(.6,0,.3,1);
 background:linear-gradient(90deg,rgba(255,255,255,.18) 0 50%,transparent 50%) 0 0/120px 100%,
 linear-gradient(0deg,rgba(255,255,255,.18) 0 50%,transparent 50%) 0 0/100% 120px,#ff6fb5;border-bottom:16px solid var(--ink);
 display:flex;align-items:center;justify-content:center;font-size:120px}
#curtain.down{transform:translateY(0)}

/* ---------- FRIEND ---------- */
#s-friend{background:repeating-conic-gradient(from 0deg at 50% 55%,#ffd1ea 0 10deg,#fff0f8 10deg 20deg)}
#fr-wrap{position:absolute;left:50%;top:570px;transform:translate(-50%,-50%)}
#fr-wrap img,#fr-sil{position:absolute;left:0;top:0;width:100%;height:100%}
#fr-sil{background:#2a1760;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transition:opacity .25s}
#fr-img{opacity:0;transition:opacity .25s}
#fr-wrap.revealed #fr-img{opacity:1}
#fr-wrap.revealed #fr-sil{opacity:0}
#fr-wrap.revealed{animation:frBounce .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes frBounce{0%{transform:translate(-50%,-50%) scale(.85)}60%{transform:translate(-50%,-50%) scale(1.07)}100%{transform:translate(-50%,-50%) scale(1)}}
#fr-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:24}
#fr-flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#fr-name{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:96px;z-index:26}
#fr-count{position:absolute;left:36px;bottom:36px;font-size:30px;z-index:26}

/* ---------- BOXES ---------- */
.gbox{position:absolute;transform-origin:50% 100%;z-index:1}
.gbox img.b{position:absolute;left:0;bottom:0;width:100%}
.gbox .bow{position:absolute;left:50%;width:76%;bottom:30%;transform:translateX(-50%) scale(.2);opacity:0;z-index:-1}
.gbox.bowup .bow{animation:bowUp .8s cubic-bezier(.2,1.5,.4,1) forwards, bowFloat 1.6s ease-in-out .8s infinite}
@keyframes bowUp{0%{transform:translateX(-50%) translateY(0) scale(.2);opacity:1}100%{transform:translateX(-50%) translateY(-210px) scale(1);opacity:1}}
@keyframes bowFloat{0%,100%{transform:translateX(-50%) translateY(-210px) scale(1);opacity:1}50%{transform:translateX(-50%) translateY(-235px) scale(1.04);opacity:1}}
.gbox .badge{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;background:var(--yel);border:9px solid var(--ink);box-shadow:0 9px 0 var(--ink);
 font-family:"PS2P";font-size:62px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.gbox.picked .b{animation:pickBob .6s ease-in-out infinite}
.gbox.picked .badge{background:var(--pink);color:#fff;animation:pickBob .6s ease-in-out infinite}
@keyframes pickBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.gbox.picked .badge{animation:pickBadge .6s ease-in-out infinite}
@keyframes pickBadge{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-16px)}}
.gbox.shake .b{animation:boxShake .35s linear}
@keyframes boxShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.gbox.miss{filter:saturate(.55) brightness(.92)}

/* ---------- CLAW ---------- */
#claw-cable{position:absolute;background:url(assets/cable.webp) 0 0/100% 16px repeat-y}
#claw-head{position:absolute}
.cap{position:absolute}
.cap.pulse{animation:capPulse .5s ease-in-out 3}
@keyframes capPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#prize{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:36;text-align:center;width:1500px}
#prize .burst{position:absolute;left:50%;top:44%;width:900px;height:900px;transform:translate(-50%,-50%);z-index:-1;
 background:repeating-conic-gradient(#ffe066 0 12deg,#ff9fd0 12deg 24deg);border-radius:50%;
 -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 12s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#prize img{height:370px;max-width:700px;object-fit:contain;animation:prizeIn .8s cubic-bezier(.2,1.6,.4,1) both, bob 1.4s ease-in-out .8s infinite}
@keyframes prizeIn{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
#prize .t{font-size:84px;margin-top:30px;animation:popIn .6s cubic-bezier(.2,1.6,.4,1) .2s both}
#prize .t.only{font-size:110px;margin-top:0}

/* ---------- CUPCAKE ---------- */
#cup-text{position:absolute;left:90px;top:300px;width:800px;text-align:center;z-index:5;font-size:98px;line-height:1.4}
#cup-text div{animation:cupWob 1.6s ease-in-out infinite}
#cup-text div:nth-child(2){animation-delay:-.8s}
@keyframes cupWob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}

/* ---------- pairing badge (TV) ---------- */
#pairbadge{position:absolute;right:26px;bottom:24px;z-index:60;background:var(--cream);border:8px solid var(--ink);border-radius:22px;padding:16px 26px;box-shadow:0 10px 0 var(--ink);text-align:center}
#pairbadge .c{font-family:"PS2P";font-size:64px;letter-spacing:10px;color:var(--hot);margin-top:8px}
#pairbadge .l{font-weight:700;font-size:30px}
#pairbadge.ok .c{font-size:28px;color:#1d9e6b;letter-spacing:2px}

/* ---------- BOOT ---------- */
#boot{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#ffb6dd,#c9b2ff);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
#boot h1{font-family:"PS2P";font-size:clamp(18px,3.4vw,40px);color:#fff;text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 6px 0 var(--ink);text-align:center;margin:0 0 6px}
#boot p{font-size:clamp(15px,2.2vw,22px);font-weight:700;text-align:center;margin:6px 0 18px;max-width:760px}
.bootbtns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:980px}
.bootbtn{background:var(--cream);border:5px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:16px 18px;width:290px;text-align:left;cursor:pointer;font-family:"Pixelify";color:var(--ink)}
.bootbtn b{display:block;font-size:24px;margin-bottom:4px}.bootbtn span{font-size:16px;font-weight:400;line-height:1.25;display:block}
.bootbtn.primary{background:#ffe066}
.bootbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
#loadbar{margin-top:18px;width:300px;height:18px;border:4px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
#loadbar div{height:100%;width:0;background:var(--pink);transition:width .2s}
#hostjoin{display:flex;gap:10px;margin-top:10px;justify-content:center}
#hostjoin input{font-family:"PS2P";font-size:24px;width:180px;text-transform:uppercase;padding:10px;border:5px solid var(--ink);border-radius:14px;text-align:center}

/* ---------- HOST CONTROLS (phone) ---------- */
.ctl{font-family:"Pixelify";color:var(--ink)}
.ctl .row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ctl .lab{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;opacity:.75;margin:12px 0 2px;width:100%}
.ctl button{font-family:"Pixelify";font-weight:700;font-size:17px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);
 padding:10px 12px;min-height:46px;cursor:pointer;flex:1 1 auto}
.ctl button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ctl button.main{background:#ffe066}.ctl button.go{background:#7df0c0}.ctl button.rev{background:#ff8fc4}.ctl button.cup{background:#ffc6a8}
.ctl button.on{background:var(--ink);color:#fff}
.ctl button:disabled{opacity:.35;box-shadow:none}
.ctl .info{background:#fff7e6;border:3px dashed var(--ink);border-radius:12px;padding:8px 10px;font-size:16px;width:100%}
.ctl select,.ctl input[type=text]{font-family:"Pixelify";font-size:16px;border:3px solid var(--ink);border-radius:10px;padding:8px;flex:1 1 140px;min-width:0;background:#fff;color:var(--ink)}
.ctl .capr{display:flex;gap:8px;align-items:center;width:100%}
.ctl .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);flex:none}
.ctl .secs{font-family:"PS2P";font-size:18px;padding:0 10px;align-self:center}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:150;background:#ffeaf5;border-top:5px solid var(--ink);border-radius:22px 22px 0 0;
 max-height:64vh;overflow:auto;padding:8px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 0 rgba(42,23,96,.25)}
#panel .ph{display:flex;align-items:center;gap:10px}
#panel button{min-height:38px;padding:6px 8px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
#panel .row{gap:6px;margin:5px 0}
#panel .lab{margin:6px 0 0;font-size:12px}
#panel .info{font-size:14px;padding:5px 8px}
#panel select{padding:5px;font-size:14px}
#panel .ph b{font-size:18px;flex:1}
#panel .resume{flex:0 0 auto;background:var(--pink);color:#fff;font-size:20px}
#taphint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:120;background:rgba(42,23,96,.75);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;font-size:15px;transition:opacity 1s;pointer-events:none}

#hostapp{position:fixed;inset:0;z-index:150;background:linear-gradient(180deg,#ffd7ec,#e6dcff);overflow:auto;padding:14px 14px 40px}
#hostapp h2{font-family:"PS2P";font-size:16px;margin:4px 0 6px;color:var(--ink)}
#hoststat{font-weight:700;font-size:15px;padding:8px 10px;border-radius:12px;background:#fff;border:3px solid var(--ink);margin-bottom:6px}
#hoststat.bad{background:#ffd0d0}
</style>
</head>
<body>
<div id="viewport">
 <div id="stage">
  <!-- HOME -->
  <div class="screen" id="s-home">
   <div class="scallop"></div>
   <div id="home-balloons"></div>
   <div class="checker"></div>
   <div id="home-title" class="px">HAPPY BIRTHDAY,</div>
   <div id="home-name" class="px rainbow"></div>
   <div id="home-nine" class="px" style="font-family:PS2P">9</div>
   <div id="home-sparkles"></div>
  </div>
  <!-- SELECT -->
  <div class="screen hidden" id="s-select">
   <div id="sel-title" class="px">CHOOSE A GAME!</div>
   <div id="sel-grid"></div>
  </div>
  <!-- HUNT -->
  <div class="screen hidden" id="s-hunt">
   <div class="scene" id="hunt-scene">
    <img class="bg" id="hunt-bg" alt="">
    <div id="hunt-item"><img id="hunt-item-img" alt=""></div>
    <img class="abs" id="hunt-occ" alt="">
   </div>

var Net={sb:null,sbState:"",sbSend:function(m){ if(this.sb) this.sb.send({type:"broadcast",event:"m",payload:m}).catch(function(){}); },room:null,named:null,bc:null,acks:[],seen:{},pending:{},tvStatus:null,tvSeenAt:0,hostSeenAt:0,
  open:async function(code,role){

      }

  },

      if(pr.role==="tv" && pr.st && typeof pr.st==="object"){ this.tvStatus=pr.st; this.tvSeenAt=Date.now(); this.onStatus(this.tvStatus); }
      if(pr.role==="host"){ this.hostSeenAt=Date.now(); updatePairBadge(); } } },
  onMsg:function(m){ if(!m) return;
    if(m.k==="cmd" && MODE==="tv"){ var d=m.d; if(!d||!d.id) return; this.hostSeenAt=Date.now(); if(this.seen[d.id]){ pushStatus(); return; } this.seen[d.id]=1; this.acks.push(d.id); this.hostSeenAt=Date.now(); updatePairBadge(); runCmd(d.c); }

};

  } else if(s.screen==="memory"){
    h+='<div class="lab">What Disappeared? · Round '+s.mem.round+'</div>';
    h+='<div class="row"><span class="secs">Memorize: '+s.mem.secs+'s</span><button data-c=\'{"t":"memSecs","v":'+(s.mem.secs-5)+'}\'>− 5s</button><button data-c=\'{"t":"memSecs","v":'+(s.mem.secs+5)+'}\'>+ 5s</button></div>';
    h+='<div class="info">'+phaseText(s)+(isHostApp&&s.mem.missing?' · Missing this round: <b>'+esc(s.mem.missing)+'</b>':'')+'<br>New time applies on the next round.</div>';
  } else if(s.screen==="friend"){
    h+='<div class="lab">Guess the Friend</div><div class="info">Friend '+s.fr.n+' of '+s.fr.of+(isHostApp?' · Answer: <b>'+esc(s.fr.name)+'</b>':'')+' · '+phaseText(s)+'</div>';
  } else if(s.screen==="boxes"){
    var b=s.box, locked=b.won||b.opened.indexOf(true)>=0;
    h+='<div class="lab">Kids picked</div><div class="row">';
    for(var i=0;i<3;i++) h+='<button class="'+(b.picked===i?'on':'')+'" data-c=\'{"t":"boxPick","v":'+i+'}\' '+((b.won||b.opened[i])?'disabled':'')+'>Box '+(i+1)+'</button>';
    h+='</div><div class="row"><button class="rev" data-c=\'{"t":"reveal"}\' '+(canReveal(s)?'':'disabled')+'>Open picked box</button><button data-c=\'{"t":"boxAnswer"}\' '+(b.won?'disabled':'')+'>Show where the bow is</button></div>';
    h+='<div class="lab">Hide the bow (before opening)</div><div class="row">';
    for(i=0;i<3;i++) h+='<button '+(isHostApp&&b.chosen==="host"&&b.bowAt===i?'class="on"':'')+' data-c=\'{"t":"boxHide","v":'+i+'}\' '+(locked?'disabled':'')+'>In '+(i+1)+'</button>';
    h+='<button '+(b.chosen==="random"?'class="on"':'')+' data-c=\'{"t":"boxHide","v":"random"}\' '+(locked?'disabled':'')+'>🎲 Random</button></div>';
    h+='<div class="info">'+(isHostApp?'Bow is in <b>box '+(b.bowAt+1)+'</b> ('+(b.chosen==="random"?'random':'you chose')+')':'Bow hidden '+(b.chosen==="random"?'at random':'where you chose'))+' · '+phaseText(s)+'</div>';
  } else if(s.screen==="claw"){
    var c=s.claw, busy=s.phase!=="choose";
    h+='<div class="lab">Kids picked</div><div class="row">';
    CAPS.forEach(function(cp,i){ h+='<button style="background:'+cp.color+'" data-c=\'{"t":"clawPick","v":'+i+'}\' '+(busy?'disabled':'')+'>'+cp.name+'</button>'; });
    h+='</div><div class="lab">Surprise in each capsule</div>';
    CAPS.forEach(function(cp,i){ h+='<div class="capr"><span class="dot" style="background:'+cp.color+'"></span><select data-cap="'+i+'">';
      SURPRISES.forEach(function(sp){ h+='<option value="'+sp.id+'" '+(c.assign[i]===sp.id?'selected':'')+'>'+esc(sp.text)+'</option>'; });
      h+='<option value="custom" '+(c.assign[i]==="custom"?'selected':'')+'>Custom text…</option></select>';
      if(c.assign[i]==="custom") h+='<input type="text" data-capt="'+i+'" maxlength="40" placeholder="Type a surprise" value="'+esc(c.custom[i]||"")+'">';
      h+='</div>'; });
    h+='<div class="row"><button data-c=\'{"t":"clawShuffle"}\'>🔀 Shuffle surprises</button></div><div class="info">'+phaseText(s)+'</div>';
  } else if(s.screen==="cupcake"){ h+='<div class="info">Cupcake Time is up! Tap Home when you’re done.</div>'; }
  else if(s.screen==="select"){ h+='<div class="info">Kids see the game list. Pick one above.</div>'; }
  else { h+='<div class="info">Birthday screen is up. Pick a game whenever you’re ready.</div>'; }
  return h;
}
function phaseText(s){ var m={intro:"Showing intro",countdown:"Counting down",search:"Kids are searching",found:"Found!",shown:"Revealed",study:"Memorizing…",cover:"Covering table",guess:"Kids are guessing",revealed:"Revealed",vote:"Kids are voting",picked:"Box picked, tap Open",missed:"Empty box, pick again",won:"Bow found",choose:"Kids are voting",grab:"Claw is grabbing…",party:""}; return m[s.phase]||""; }

function wireControls(root, isHostApp, closeAfter){
  root.onclick=function(e){ var b=e.target.closest("button[data-c]"); if(!b||b.disabled) return; e.stopPropagation(); var c=JSON.parse(b.getAttribute("data-c")); send(c);
    var keepOpen={memSecs:1,boxHide:1,boxPick:1,clawShuffle:1,music:1,sfx:1,select:1};
    if(closeAfter && !keepOpen[c.t]) closePanel(); };
  root.onchange=function(e){ var t=e.target;
    if(t.hasAttribute("data-cap")){ var i=+t.getAttribute("data-cap"); send({t:"clawSet",i:i,v:t.value}); }
    if(t.hasAttribute("data-capt")){ var j=+t.getAttribute("data-capt"); send({t:"clawSet",i:j,v:"custom",custom:t.value}); } };
}

/* ---------- mirror mode panel ---------- */
var panelOpen=false;
function openPanel(){ panelOpen=true; renderPanel(); $("panel").classList.remove("hidden"); $("taphint").classList.add("hidden"); }
function closePanel(){ panelOpen=false; $("panel").classList.add("hidden"); }
function renderPanel(){ if(!panelOpen) return; var p=$("panel"); var focused=document.activeElement&&p.contains(document.activeElement)&&document.activeElement.tagName==="INPUT"; if(focused) return;
  var st=p.scrollTop; p.innerHTML='<div class="ph"><b>Host controls</b><button class="resume" id="fsbtn" style="background:#fff;color:var(--ink)">⛶ Full screen</button><button class="resume" id="resumebtn">▶ Resume</button></div>'+controlsHTML(statusObj(),false); p.scrollTop=st;
  $("resumebtn").onclick=function(e){ e.stopPropagation(); closePanel(); };
  $("fsbtn").onclick=function(e){ e.stopPropagation(); goFull(); }; }

/* ---------- host app (phone in split mode) ---------- */
function renderHost(){ if(MODE!=="host") return; var r=$("hostapp"); var f=document.activeElement; if(f&&r.contains(f)&&(f.tagName==="INPUT"||f.tagName==="SELECT")) return;
  var st=r.scrollTop; r.innerHTML='<h2>NORA’S PARTY · HOST</h2><div id="hoststat"></div>'+controlsHTML(Net.tvStatus,true); r.scrollTop=st; renderHostStatusLine(); }
function renderHostStatusLine(){ var el=$("hoststat"); if(!el) return; var ok=Net.tvSeenAt&&Date.now()-Net.tvSeenAt<15000; var pend=Object.keys(Net.pending).length;
  el.className=ok?"":"bad"; el.textContent=ok?("Paired with TV "+PAIRCODE+(pend?" · sending…":" · connected")):("Looking for TV "+PAIRCODE+"… keep the TV View open"); }

/* ================= BOOT / MODES ================= */
function fit(){ var vw=window.innerWidth, vh=window.innerHeight, s=Math.min(vw/1920,vh/1080); var st=$("stage");
  st.style.transform="translate("+((vw-1920*s)/2)+"px,"+((vh-1080*s)/2)+"px) scale("+s+")"; }
window.addEventListener("resize",fit);
function goFull(){ var d=document.documentElement; try{ (d.requestFullscreen||d.webkitRequestFullscreen).call(d).catch(function(){}); }catch(e){} }
var wakeLock=null; async function keepAwake(){ try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&MODE&&MODE!=="host") keepAwake(); });

function preload(done){ var list=Object.keys(SIZES).map(A).concat(["bakery","bedroom","table","stage","playfield","clawframe","cupcakes","cable"].map(A));
  Object.keys(PLACE).forEach(function(k){ PLACE[k].forEach(function(p){ list.push("assets/"+p.occImg); }); });
  var n=0, failed=[]; list.forEach(function(src){ var im=new Image(); im.onload=im.onerror=function(e){ if(e.type==="error") failed.push(src); n++; $("loadbar").firstChild.style.width=(100*n/list.length)+"%"; if(n===list.length) done(failed); }; im.src=src; }); }

function genCode(){ var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789", s=""; for(var i=0;i<4;i++) s+=a[rand(a.length)]; return s; }

function startMode(mode){
  MODE=mode; $("boot").classList.add("hidden");
  if(mode==="host"){ $("viewport").classList.add("hidden"); $("hostapp").classList.remove("hidden"); wireControls($("hostapp"),true,false); renderHost(); return; }
  Snd.init(); keepAwake(); goFull(); fit(); goHome();
  if(mode==="mirror"){
    wireControls($("panel"),false,true);
    $("viewport").addEventListener("click",function(){ if(!panelOpen) openPanel(); });
    var th=$("taphint"); th.classList.remove("hidden"); setTimeout(function(){ th.style.opacity=0; setTimeout(function(){th.classList.add("hidden")},1000); },6000);
    statusListeners.push(function(){ renderPanel(); });
  } else if(mode==="tv"){
    try{ PAIRCODE=localStorage.getItem("nora9code")||""; }catch(e){}
    if(!PAIRCODE){ PAIRCODE=genCode(); try{ localStorage.setItem("nora9code",PAIRCODE); }catch(e){} }
    $("paircode").textContent=PAIRCODE; $("pairbadge").classList.remove("hidden");
    Net.open(PAIRCODE,"tv").then(function(){ pushStatus(); });
    setInterval(function(){ updatePairBadge(); pushStatus(); },4000);
    $("viewport").addEventListener("click",function(){ Snd.init(); if(Snd.ctx&&Snd.ctx.state==="suspended") Snd.ctx.resume(); });
  }
}

/* build static parts */
FX.init(); buildHome(); buildSelect(); memBuild(); boxBuild(); clawBuild(); capReset(); clawRender(); fit();
preload(function(failed){
  $("loadbar").classList.add("hidden"); $("bootbtns").classList.remove("hidden");
  $("bootmsg").innerHTML = failed.length? ("Some art didn’t load: "+failed.map(esc).join(", ")) : "How are we playing today?";
  var h=(location.hash||"").replace("#","");
  if(h==="mirror"||h==="tv"){ /* still need a tap for audio: highlight that button */ var b=document.querySelector('[data-mode="'+h+'"]'); if(b) b.classList.add("primary"); }
});
document.querySelectorAll(".bootbtn[data-mode]").forEach(function(b){ b.onclick=function(){ var m=b.getAttribute("data-mode");
  if(m==="host"){ $("bootbtns").classList.add("hidden"); $("hostjoin").classList.remove("hidden"); $("bootmsg").textContent="Type the code shown on the TV"; $("codein").focus(); return; }
  startMode(m); }; });
$("codego").onclick=function(){ var c=$("codein").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length!==4){ $("bootmsg").textContent="The code has 4 letters or numbers"; return; }
  PAIRCODE=c; Net.open(c,"host").then(function(ok){ startMode("host"); if(Net.named) Net.named.presence({role:"host"}); renderHost(); }); };
</script>
